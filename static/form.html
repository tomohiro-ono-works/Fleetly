<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Flow Prototype</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="./css/00_tokens.css">
  <link rel="stylesheet" href="./css/01_base.css">
  <link rel="stylesheet" href="./css/10_header.css">
  <link rel="stylesheet" href="./css/20_node-detail.css">
  <link rel="stylesheet" href="./css/30_flowchart.css">
  <link rel="stylesheet" href="./css/40_detail-panel.css">
  <link rel="stylesheet" href="./css/90_responsive.css">

<body>
  <header>
    <div class="header-inner">
      <div class="header-left">
        <img
          src="./img/icon.png"
          alt="App Icon"
          class="app-icon"
        />
        <input id="flowName" class="flow-name-input" type="text" value="フロー１" />
      </div>
      <div class="actions">
        <button id="btnReset" class="danger">インポート</button>
        <button id="btnSave" class="primary">保存</button>

      </div>
    </div>
  </header>

  <main>
    <!-- <div class="hint">
      ・上部のフローチャートでノードを選択すると、下部に詳細フォームが表示されます。<br/>
      ・右側ボタンは <code>I</code> / <code>P</code> です。右ノード未作成時は <code>I</code> のみ表示されます。
    </div> -->

    <!-- <section class="panel flow-panel">
      <h2>Flowchart</h2> -->
      <div id="flowchart"></div>
    <!-- </section> -->

    <section class="panel detail-panel">
      <div class="detail-resize-handle" aria-label="Resize Node Details"></div>
      <div id="nodeDetail"></div>
    </section>
  </main>

  <!-- B方式：モジュール不使用。順番が命 -->
  <script src="./js/config.js"></script>
  <script src="./js/utils.js"></script>
  <script src="./js/state.js"></script>
  <script src="./js/vars.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
  <script src="./js/ui.suggest.js"></script>
  <script src="./js/ui.fields.js"></script>
  <script src="./js/ui.node.js"></script>
  <script src="./js/ui.renderer.js"></script>
  <script src="./js/app.js"></script>
