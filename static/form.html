<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Flow Prototype</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="title">
        <strong>Flow Prototype</strong>
        <span>設定駆動フォーム / 変数参照 / 保存</span>
      </div>
      <div class="actions">
        <button id="btnReset" class="danger">リセット</button>
        <button id="btnSave" class="primary">保存</button>

      </div>
    </div>
  </header>

  <main>
    <!-- <div class="hint">
      ・上部のフローチャートでノードを選択すると、下部に詳細フォームが表示されます。<br/>
      ・右側ボタンは <code>I</code> / <code>P</code> です。右ノード未作成時は <code>I</code> のみ表示されます。
    </div> -->

    <!-- <section class="panel flow-panel">
      <h2>Flowchart</h2> -->
      <div id="flowchart"></div>
    <!-- </section> -->

    <section class="panel detail-panel">
      <h2>Node Details</h2>
      <div id="nodeDetail"></div>
    </section>
  </main>

  <!-- B方式：モジュール不使用。順番が命 -->
  <script src="./config.js"></script>
  <script src="./utils.js"></script>
  <script src="./state.js"></script>
  <script src="./vars.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
  <script src="./ui.suggest.js"></script>
  <script src="./ui.fields.js"></script>
  <script src="./ui.node.js"></script>
  <script src="./ui.renderer.js"></script>
  <script src="./app.js"></script>
</body>
</html>
