<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Flow Prototype</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="title">
        <strong>Flow Prototype</strong>
        <span>設定駆動フォーム / 変数参照 / 保存</span>
      </div>
      <div class="actions">
        <button id="btnReset" class="danger">リセット</button>
        <button id="btnSave" class="primary">保存（JSON）</button>
      </div>
    </div>
  </header>

  <main>
    <div class="hint">
      ・ノードのType/Actionを選ぶとフォームが切り替わります。<br/>
      ・上のノードで「出力変数」を定義すると、下のノードで <code>${var}</code> 入力時に候補が出ます。
    </div>

    <div id="nodes"></div>
  </main>

  <!-- B方式：モジュール不使用。順番が命 -->
  <script src="./config.js"></script>
  <script src="./utils.js"></script>
  <script src="./state.js"></script>
  <script src="./vars.js"></script>
  <script src="./renderer.js"></script>
  <script src="./app.js"></script>
</body>
</html>
