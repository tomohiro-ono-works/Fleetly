<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fleetly | Visual Workflow Builder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- ドラッグ&ドロップ用ライブラリ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- YAML変換用 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <style>
        .step-card { transition: all 0.2s; border-left-width: 6px; }
        .step-handle { cursor: grab; }
        .step-handle:active { cursor: grabbing; }
        .ghost-card { opacity: 0.4; background: #dbeafe; border: 2px dashed #2563eb; }
    </style>
</head>
<body class="bg-slate-100 h-screen flex flex-col text-slate-800">

    <header class="bg-slate-900 text-white h-14 flex items-center justify-between px-6 shadow-lg z-10">
        <div class="flex items-center space-x-3">
            <div class="bg-blue-600 p-1.5 rounded-lg"><i class="fas fa-layer-group text-xl"></i></div>
            <span class="text-lg font-bold">Fleetly Builder</span>
        </div>
        <div id="connection-status" class="text-xs text-slate-400 font-mono">Connecting...</div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- サイドバー: ワークフロー選択 -->
        <aside class="w-64 bg-white border-r border-slate-200 flex flex-col shadow-inner">
            <div class="p-4 flex items-center justify-between border-b bg-slate-50">
                <span class="text-xs font-bold text-slate-500 uppercase">フロー一覧</span>
                <button onclick="createNew()" class="text-blue-600 hover:text-blue-800"><i class="fas fa-plus-circle"></i></button>
            </div>
            <nav id="workflow-list" class="flex-1 overflow-y-auto p-2 space-y-1"></nav>
        </aside>

        <!-- メイン画面 -->
        <main class="flex-1 flex flex-col overflow-hidden">
            <!-- ツールバー -->
            <div class="bg-white border-b p-3 flex items-center justify-between px-6 shadow-sm">
                <div class="flex items-center space-x-4">
                    <h2 id="current-filename" class="text-sm font-mono font-bold text-blue-600 underline">ファイルを選択してください</h2>
                    <button id="add-step-btn" onclick="addStepCard()" class="bg-slate-800 text-white px-4 py-1.5 rounded-lg text-sm hover:bg-slate-700 transition">
                        <i class="fas fa-plus mr-2"></i>ステップを追加
                    </button>
                </div>
                <div class="flex items-center space-x-3">
                    <button onclick="saveWorkflow()" class="bg-green-600 text-white px-5 py-1.5 rounded-lg text-sm font-bold hover:bg-green-700 shadow-sm">
                        <i class="fas fa-save mr-2"></i>保存
                    </button>
                    <button id="run-btn" onclick="runWorkflow()" class="bg-blue-600 text-white px-8 py-1.5 rounded-lg text-sm font-bold hover:bg-blue-700 shadow-md">
                        <i class="fas fa-play mr-2"></i>実行
                    </button>
                </div>
            </div>

            <!-- ビジュアルエディタ（ドラッグ可能エリア） -->
            <div id="visual-editor" class="flex-1 overflow-y-auto p-8 space-y-4">
                <!-- ここにステップカードが並ぶ -->
                <div id="step-container" class="max-w-3xl mx-auto space-y-4">
                    <div class="text-center py-20 text-slate-400">
                        <i class="fas fa-mouse-pointer text-4xl mb-4 block"></i>
                        ワークフローを選択するか、新しいステップを追加してください
                    </div>
                </div>
            </div>

            <!-- ログコンソール -->
            <div class="h-40 bg-slate-900 border-t-4 border-slate-700 p-3 overflow-y-auto font-mono text-xs text-green-400 scroll-smooth" id="console">
                <div class="text-slate-500 italic">Console ready...</div>
            </div>
        </main>
    </div>

    <!-- ステップカードのテンプレート -->
    <template id="step-template">
        <div class="step-card bg-white rounded-xl shadow-sm border border-slate-200 p-4 relative group flex flex-col space-y-3 border-l-blue-500">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="step-handle text-slate-300 hover:text-slate-500 px-1 py-2">
                        <i class="fas fa-grip-lines"></i>
                    </div>
                    <input type="text" placeholder="ステップ名" class="step-id bg-slate-50 border-none text-sm font-bold rounded px-2 py-1 w-48 focus:ring-2 focus:ring-blue-400">
                </div>
                <button onclick="this.closest('.step-card').remove()" class="text-slate-300 hover:text-red-500 transition">
                    <i class="fas fa-times-circle"></i>
                </button>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-[10px] text-slate-400 uppercase font-bold mb-1">コネクタ</label>
                    <select class="connector-select w-full border border-slate-200 rounded text-sm p-1.5 bg-white">
                        <option value="file_connector">ファイル操作 (CSV/Excel)</option>
                        <option value="bq_connector">BigQuery (SQL/Load)</option>
                        <option value="shell_connector">Windowsコマンド (BAT)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] text-slate-400 uppercase font-bold mb-1">アクション</label>
                    <input type="text" placeholder="read_csv, execute_sql など" class="action-input w-full border border-slate-200 rounded text-sm p-1.5">
                </div>
            </div>

            <div class="bg-slate-50 p-3 rounded-lg border border-slate-100">
                <label class="block text-[10px] text-slate-400 uppercase font-bold mb-1">パラメータ (JSON形式で入力)</label>
                <textarea placeholder='{"file_path": "C:/data/test.csv"}' class="params-input w-full bg-white border border-slate-200 rounded text-xs p-2 font-mono h-16 shadow-inner"></textarea>
            </div>

            <div>
                <label class="block text-[10px] text-slate-400 uppercase font-bold mb-1">出力変数名 (任意)</label>
                <input type="text" placeholder="output_variable" class="output-variable w-full border border-slate-200 rounded text-xs p-1.5">
            </div>
        </div>
    </template>

    <script>
        let currentFile = null;
        const container = document.getElementById('step-container');
        const consoleEl = document.getElementById('console');

        // ドラッグ&ドロップの有効化
        new Sortable(container, {
            animation: 150,
            handle: '.step-handle',
            ghostClass: 'ghost-card'
        });

        // ワークフロー一覧読込
        async function loadWorkflows() {
            const res = await fetch('/api/workflows');
            const data = await res.json();
            const list = document.getElementById('workflow-list');
            list.innerHTML = '';
            data.workflows.forEach(file => {
                const li = document.createElement('div');
                li.className = `p-3 text-sm cursor-pointer hover:bg-slate-50 border-l-4 ${currentFile === file ? 'bg-blue-50 border-blue-600 font-bold' : 'border-transparent text-slate-600'}`;
                li.innerText = file;
                li.onclick = () => selectWorkflow(file);
                list.appendChild(li);
            });
        }

        // ステップカードの追加
        function addStepCard(data = {}) {
            // 最初に追加するとき、プレースホルダーを消す
            if (container.querySelector('.text-slate-400')) container.innerHTML = '';

            const temp = document.getElementById('step-template');
            const clone = temp.content.cloneNode(true);
            const card = clone.querySelector('.step-card');

            // 既存データがあれば流し込む
            if (data.step_id) card.querySelector('.step-id').value = data.step_id;
            if (data.connector) card.querySelector('.connector-select').value = data.connector;
            if (data.action) card.querySelector('.action-input').value = data.action;
            if (data.params) card.querySelector('.params-input').value = JSON.stringify(data.params, null, 2);
            if (data.output_variable) card.querySelector('.output-variable').value = data.output_variable;

            // コネクタによってカードの色を変える
            const colorMap = {
                file_connector: 'border-l-blue-500',
                bq_connector: 'border-l-orange-500',
                shell_connector: 'border-l-slate-800'
            };
            const updateColor = (select) => {
                card.classList.remove('border-l-blue-500', 'border-l-orange-500', 'border-l-slate-800');
                card.classList.add(colorMap[select.value] || 'border-l-blue-500');
            };
            const sel = card.querySelector('.connector-select');
            sel.onchange = () => updateColor(sel);
            updateColor(sel);

            container.appendChild(clone);
        }

        // ワークフロー選択
        async function selectWorkflow(file) {
            currentFile = file;
            document.getElementById('current-filename').innerText = file;
            const res = await fetch(`/api/workflows/${file}`);
            const data = await res.json();
            
            const yamlObj = jsyaml.load(data.content);
            container.innerHTML = ''; // クリア
            
            if (yamlObj.steps && yamlObj.steps.length > 0) {
                yamlObj.steps.forEach(step => addStepCard(step));
            } else {
                addStepCard(); // 空のカードを1つ出す
            }
            loadWorkflows();
        }

        // 画面上のカードからYAMLを生成して保存
        async function saveWorkflow() {
            if (!currentFile) return;

            const stepCards = container.querySelectorAll('.step-card');
            const steps = Array.from(stepCards).map(card => {
                let params = {};
                try {
                    params = JSON.parse(card.querySelector('.params-input').value || '{}');
                } catch(e) {
                    alert(`${card.querySelector('.step-id').value} のパラメータが正しいJSONではありません。`);
                }
                
                return {
                    step_id: card.querySelector('.step-id').value,
                    connector: card.querySelector('.connector-select').value,
                    action: card.querySelector('.action-input').value,
                    params: params,
                    output_variable: card.querySelector('.output-variable').value || undefined
                };
            });

            const yamlObj = {
                workflow_metadata: { name: currentFile.replace('.yaml','') },
                steps: steps
            };

            const yamlText = jsyaml.dump(yamlObj);
            
            await fetch(`/api/workflows/${currentFile}`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ content: yamlText })
            });
            appendLog(`[SYSTEM] ${currentFile} を保存しました。`, "text-blue-400");
        }

        async function runWorkflow() {
            if (!currentFile) return;
            await saveWorkflow();
            appendLog(`\n>>> 実行プロセス開始: ${currentFile}`, "text-white font-bold border-t border-slate-700 mt-2 pt-2");
            await fetch(`/api/execute/${currentFile}`, { method: 'POST' });
        }

        function appendLog(msg, className = "") {
            const div = document.createElement('div');
            div.className = className;
            div.innerText = msg;
            consoleEl.appendChild(div);
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }

        // WebSocket接続
        const ws = new WebSocket(`ws://${window.location.host}/ws/logs`);
        ws.onmessage = (event) => appendLog(event.data);
        ws.onopen = () => { document.getElementById('connection-status').innerText = "Server: Connected"; };

        loadWorkflows();
    </script>
</body>
</html>
