<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>高度なマインドマップ・エディタ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-top">
            <input type="text" id="map-title" style="font-size:18px; font-weight:bold; border:none; outline:none; width:300px;" placeholder="無題のマインドマップ">
            <div class="btn-group">
                <button class="btn btn-export" onclick="exportJson()">JSONエクスポート</button>
                <button class="btn btn-import" onclick="document.getElementById('file-input').click()">JSONインポート</button>
                <input type="file" id="file-input" style="display:none" accept=".json" onchange="importJson(event)">
            </div>
        </div>
        <div class="header-labels">
            <div class="label-group"><span class="dot" style="background:var(--label1-clr)"></span> 右上: <input type="text" id="l-opt-1" value="A, B, C"></div>
            <div class="label-group"><span class="dot" style="background:var(--label2-clr)"></span> 右下: <input type="text" id="l-opt-2" value="重要, 警告"></div>
            <div class="label-group"><span class="dot" style="background:var(--label3-clr)"></span> 左下: <input type="text" id="l-opt-3" value="1, 2, 3"></div>
        </div>
    </header>

    <div class="main-container">
        <canvas id="canvas"></canvas>
        <div id="context-menu"></div>
    <!-- <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" /> -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism.min.css" rel="stylesheet" />

    <aside id="sidebar" class="hidden">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3>詳細編集</h3>
            <button onclick="closeSidebar()">✕</button>
        </div>
        <label>名称</label>
        <input type="text" id="edit-node-name">
        
        <label>ノート (Markdown/Code)</label>
        <div id="note-container" style="flex:1; display:flex; flex-direction:column; position:relative;">
            <textarea id="edit-node-note" placeholder="コードは ```sql ... ``` のように入力"></textarea>
            <div id="note-preview" class="hidden"></div>
        </div>
    </aside>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
    

    <script src="script.js"></script>
    <script src="ui.js"></script>
</body>
</html>
